<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Nexus AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8; 
      }

      /* Global Button "High End" Tactile Feel */
      button {
        transition: filter 0.2s, scale 0.1s ease-in-out;
      }
      
      /* Use the modern 'scale' property to avoid conflict with Tailwind 'transform' classes */
      button:active {
        scale: 0.96;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script>
      // Global Haptic Feedback Listener
      document.addEventListener('mousedown', (e) => {
        // Find closest button or clickable element
        const target = e.target.closest('button, a, [role="button"]');
        if (target) {
          // Trigger vibration if supported
          if (typeof navigator.vibrate === 'function') {
            navigator.vibrate(10); // Short, crisp tick
          }
        }
      });
      
      // Also trigger on touchstart for mobile responsiveness without waiting for click
      document.addEventListener('touchstart', (e) => {
        const target = e.target.closest('button, a, [role="button"]');
        if (target) {
          if (typeof navigator.vibrate === 'function') {
            navigator.vibrate(10);
          }
        }
      }, { passive: true });
    </script>
  </body>
</html>
